version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustchain-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: trustchain
      POSTGRES_PASSWORD: trustchain_secret
      POSTGRES_DB: trustchain
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
