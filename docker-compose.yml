services:
  postgres:
    image: postgres:16-alpine
    container_name: trustchain-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: trustchain
      POSTGRES_PASSWORD: trustchain_secret
      POSTGRES_DB: trustchain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trustchain -d trustchain']
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
